name: publish-webrtc-testbed

on:
  push:
    branches: [main]
    paths:
      - 'java/jsyn-webrtc-testbed/**'
      - '.github/workflows/publish-webrtc-testbed.yml'
  workflow_dispatch:

# main only moves to commits whose ci checks passed (repository ruleset), so this
# publishes an image the ci workflow already built, started and health-checked.
env:
  # Pushed to the registry in REGISTRY_HOST; pulled publicly as
  # cr.synauson.com/synauson/synauson-webrtc-testbed.
  IMAGE: synauson/synauson-webrtc-testbed

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Wait for jsyn-natives-linux to be published
        run: |
          VERSION=$(grep 'jsynNativesLinuxVersion' java/jsyn-webrtc-testbed/build.gradle.kts \
            | head -1 | grep -oP '"[^"]+"' | tr -d '"')
          POM="https://maven.synauson.com/releases/com/synauson/jsyn-natives-linux/${VERSION}/jsyn-natives-linux-${VERSION}.pom"
          for i in $(seq 1 20); do
            if curl -sfI "$POM" >/dev/null; then
              echo "Found com.synauson:jsyn-natives-linux:${VERSION}."
              exit 0
            fi
            echo "Attempt $i/20: not yet available, waiting 30s..."
            sleep 30
          done
          echo "::error::com.synauson:jsyn-natives-linux:${VERSION} not found after 10 minutes"
          exit 1

      - name: Compute image tags
        id: tags
        env:
          REGISTRY: ${{ secrets.REGISTRY_HOST }}
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          TS=$(date -u +%Y%m%d%H%M)
          BRANCH=${GITHUB_REF_NAME//\//-}
          echo "primary=${REGISTRY}/${IMAGE}:${BRANCH}-${SHA}-${TS}" >> "$GITHUB_OUTPUT"
          echo "latest=${REGISTRY}/${IMAGE}:latest"                  >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: java/jsyn-webrtc-testbed/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.primary }}
            ${{ steps.tags.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
